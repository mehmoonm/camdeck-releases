# Builds CamDeck from the private source repository (mehmoonm/camera-app)
# and publishes the apps here, where the in-app updater looks.
#
# Runs here because public repositories get GitHub Actions for free.
# The source code is never copied into this repository: it is checked out
# inside the build machine only, and only the finished apps are published.
#
# Start it from the Actions tab: "Build and release" -> Run workflow.
#
# Secrets needed in this repository (Settings -> Secrets and variables ->
# Actions):
#   SOURCE_TOKEN               fine-grained token, Contents: read-only,
#                              only on mehmoonm/camera-app
#   ANDROID_KEYSTORE_BASE64    } the same Android signing key as before,
#   ANDROID_KEYSTORE_PASSWORD  } so installed apps keep updating
#   ANDROID_KEY_ALIAS          }
#   ANDROID_KEY_PASSWORD       }

name: Build and release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version to publish, e.g. v1.9.0 (must match pubspec.yaml). Leave empty to only build and test.'
        required: false
        default: ''
      source_ref:
        description: 'Branch, tag or commit of camera-app to build'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  test:
    # Only the owner's copy runs this (forks have no secrets anyway).
    if: github.repository == 'mehmoonm/camdeck-releases'
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs and secrets
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Add the SOURCE_TOKEN secret (fine-grained token, Contents: read-only on mehmoonm/camera-app)."
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ] && ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.9.0"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: mehmoonm/camera-app
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Version matches the tag
        if: env.RELEASE_TAG != ''
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$v" != "$RELEASE_TAG" ]; then
            echo "::error::pubspec.yaml says $v but the release tag is $RELEASE_TAG"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  prepare-release:
    if: inputs.release_tag != ''
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create draft release
        run: |
          cat > notes.md <<NOTES
          CamDeck $RELEASE_TAG

          * Windows: download \`CamDeck-windows-x64.zip\`, unzip and run \`camdeck.exe\`.
          * Android: \`CamDeck-android-arm64.apk\` (most phones), \`-arm32.apk\` (older phones and most TV boxes) or \`-universal.apk\`.

          Installed copies update themselves (Settings > Check now).
          NOTES
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; files will be replaced."
          else
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft \
              --title "CamDeck $RELEASE_TAG" --notes-file notes.md
          fi

  android:
    needs: [test, prepare-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mehmoonm/camera-app
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Refuse to release without the signing key
        if: env.HAS_SIGNING_KEY != 'true' && env.RELEASE_TAG != ''
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_* secrets. Without them phones could not update."
          exit 1
      - name: Set up release signing
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release
      - name: Remove the signing key from the build machine
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/CamDeck-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/CamDeck-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/CamDeck-android-arm32.apk
      - name: Add APKs to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.apk --clobber -R "$GITHUB_REPOSITORY"

  windows:
    needs: [test, prepare-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mehmoonm/camera-app
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test the self-update script
        run: flutter test test/updater_windows_test.dart
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\CamDeck-windows-x64.zip
      - name: Add the Windows zip to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/CamDeck-windows-x64.zip --clobber -R "$GITHUB_REPOSITORY"

  release:
    needs: [prepare-release, android, windows]
    if: ${{ !failure() && !cancelled() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
